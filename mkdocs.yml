site_name: ESO Build Guides
site_description: Living ESO build guides — full builds and one-bar builds (Update 50)
site_url: https://txbluemoose.github.io/Moose-ESO/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - abbr
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
      auto_append:
        - includes/abbreviations.md
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Full Builds:
      - Magicka Dragonknight:
          - Melee: full-builds/magicka-dragonknight.md
          - Ranged (Two Staves): full-builds/magicka-dragonknight-ranged.md
      - Stamina Warden:
          - Melee: full-builds/stamina-warden.md
          - Bow: full-builds/stamina-warden-bow.md
      - Magicka Sorcerer:
          - Melee: full-builds/magicka-sorcerer.md
          - Ranged (Two Staves): full-builds/magicka-sorcerer-ranged.md
      - Arcanist: full-builds/arcanist.md
      - Nightblade: full-builds/nightblade.md
      - Templar: full-builds/templar.md
      - Necromancer: full-builds/necromancer.md
      - Werewolf: full-builds/werewolf.md
  - One-Bar Builds:
      - Dragonknight: one-bar-builds/one-bar-dragonknight.md
      - Pet Sorcerer: one-bar-builds/one-bar-sorcerer.md
      - Arcanist: one-bar-builds/one-bar-arcanist.md
      - Nightblade: one-bar-builds/one-bar-nightblade.md
      - Templar: one-bar-builds/one-bar-templar.md
      - Necromancer: one-bar-builds/one-bar-necromancer.md
      - Bow Warden (2-bar): one-bar-builds/warden-bow-two-bar.md
      - Werewolf: one-bar-builds/werewolf.md
  - Companions: shared/companions.md
  - Race & Class: shared/races.md
  - Notes:
      - Farming: notes/farming.md
      - Patch Watch: notes/patch-watch.md
  - Glossary: glossary.md
