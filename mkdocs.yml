site_name: ESO Build Guides
site_description: Living ESO build guides — full builds and one-bar builds (Update 50)
site_url: https://txbluemoose.github.io/Moose-ESO/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - abbr
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
      auto_append:
        - includes/abbreviations.md
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Full Builds:
      - Magicka Dragonknight: full-builds/magicka-dragonknight.md
      - Stamina Warden: full-builds/stamina-warden.md
      - Magicka Sorcerer: full-builds/magicka-sorcerer.md
  - One-Bar Builds:
      - Dragonknight: one-bar-builds/one-bar-dragonknight.md
      - Pet Sorcerer: one-bar-builds/one-bar-sorcerer.md
      - Arcanist: one-bar-builds/one-bar-arcanist.md
  - Companions: shared/companions.md
  - Notes:
      - Farming: notes/farming.md
      - Patch Watch: notes/patch-watch.md
  - Glossary: glossary.md
