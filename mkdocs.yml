site_name: ESO Build Guides
site_description: Living ESO build guides — full builds and one-bar builds (Update 50)
site_url: https://txbluemoose.github.io/Moose-ESO/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - abbr
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
      auto_append:
        - includes/abbreviations.md
  - toc:
      permalink: true

extra_css:
  - assets/extra.css
  - assets/planner.css

nav:
  - Home: index.md
  - Full Builds:
      - Dragonknight:
          - Magicka — Melee: full-builds/magicka-dragonknight.md
          - Magicka — Ranged (Two Staves): full-builds/magicka-dragonknight-ranged.md
          - Stamina: full-builds/stamina-dragonknight.md
      - Sorcerer:
          - Magicka — Melee: full-builds/magicka-sorcerer.md
          - Magicka — Ranged (Two Staves): full-builds/magicka-sorcerer-ranged.md
          - Stamina: full-builds/stamina-sorcerer.md
      - Warden:
          - Stamina — Melee: full-builds/stamina-warden.md
          - Stamina — Bow: full-builds/stamina-warden-bow.md
          - Magicka: full-builds/magicka-warden.md
      - Nightblade:
          - Stamina: full-builds/nightblade.md
          - Magicka: full-builds/magicka-nightblade.md
      - Templar:
          - Stamina: full-builds/templar.md
          - Magicka: full-builds/magicka-templar.md
      - Necromancer:
          - Magicka: full-builds/necromancer.md
          - Stamina: full-builds/stamina-necromancer.md
      - Arcanist:
          - Stamina: full-builds/arcanist.md
          - Magicka: full-builds/magicka-arcanist.md
      - Werewolf (Berserker): full-builds/werewolf.md
  - One-Bar Builds:
      - Dragonknight:
          - Magicka: one-bar-builds/one-bar-dragonknight.md
          - Stamina (Bow): one-bar-builds/one-bar-dragonknight-stamina.md
      - Sorcerer:
          - Magicka (Pets): one-bar-builds/one-bar-sorcerer.md
          - Stamina (Bow): one-bar-builds/one-bar-sorcerer-stamina.md
      - Nightblade:
          - Magicka: one-bar-builds/one-bar-nightblade.md
